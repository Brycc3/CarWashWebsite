<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Refining Auto Detailing</title>
    <meta name="description" content="See our work — a gallery of freshly detailed vehicles. Click any photo to browse the full collection.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://www.refiningautodetailing.com/gallery.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Refining Auto Detailing">
    <meta property="og:title" content="Gallery | Refining Auto Detailing">
    <meta property="og:description" content="See our work — a gallery of freshly detailed vehicles.">
    <meta property="og:url" content="https://www.refiningautodetailing.com/gallery.html">
    <meta property="og:image" content="https://www.refiningautodetailing.com/images/carr2.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#0b0d12">
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body>
    <!-- Header -->
    <div id="header-placeholder"></div>
    <script>
        fetch("header.html").then(r => r.text()).then(d => {
            document.getElementById("header-placeholder").innerHTML = d;
        });
    </script>

    <div class="content">
        <section class="section">
            <div class="container">
                <div class="section-head reveal">
                    <span class="eyebrow">Our Work</span>
                    <h2>Detailing Gallery</h2>
                    <p class="section-lead">Click any vehicle to open the viewer and browse the full collection.</p>
                </div>

                <div class="gallery-grid reveal" data-gallery>
                    <div class="gallery-item"><img src="images/carr2.jpg" alt="Detailed car — front profile"></div>
                    <div class="gallery-item"><img src="images/carr1.JPG" alt="Detailed car — glossy finish"></div>
                    <div class="gallery-item"><img src="images/carr6.jpg" alt="Detailed car — side view"></div>
                    <div class="gallery-item"><img src="images/exterior.jpg" alt="Exterior detailing result"></div>
                    <div class="gallery-item"><img src="images/carr5.JPG" alt="Detailed car — clean wheels"></div>
                    <div class="gallery-item"><img src="images/interior.jpg" alt="Interior detailing result"></div>
                    <div class="gallery-item"><img src="images/full-detail.jpg" alt="Full detail package result"></div>
                </div>
            </div>
        </section>
    </div>

    <!-- Footer -->
    <div id="footer-placeholder"></div>
    <script>
        fetch("footer.html").then(r => r.text()).then(d => {
            document.getElementById("footer-placeholder").innerHTML = d;
        });
    </script>
</body>
</html>
